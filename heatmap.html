<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankNifty Tracker</title>
    <!-- Auto-refreshes the TV browser every 15 mins to prevent freezing -->
    <meta http-equiv="refresh" content="900">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #131722; 
        }
        .tradingview-widget-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
      {
      "width": "100%",
      "height": "100%",
      "symbolsGroups": [
        {
          "name": "BankNifty Heavyweights",
          "symbols": [
            { "name": "BSE:HDFCBANK" },
            { "name": "BSE:ICICIBANK" },
            { "name": "BSE:SBIN" },
            { "name": "BSE:AXISBANK" },
            { "name": "BSE:KOTAKBANK" },
            { "name": "BSE:INDUSINDBK" }
          ]
        }
      ],
      "showSymbolLogo": true,
      "isTransparent": false,
      "colorTheme": "dark",
      "locale": "in",
      "backgroundColor": "#131722"
      }
      </script>
    </div>
    <!-- TradingView Widget END -->
</body>
</html>
