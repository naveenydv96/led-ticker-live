<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Heatmap</title>
    <!-- Auto-refreshes the TV browser every 60 seconds -->
    <meta http-equiv="refresh" content="60">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #131722; 
        }
        /* Forces the copied widget to stretch full screen on the TV */
        .tradingview-widget-container { width: 100vw; height: 100vh; }
        .tradingview-widget-container iframe { width: 100vw !important; height: 100vh !important; }
    </style>
</head>
<body>
    
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-heatmap.js"></script>

<tv-heatmap heatmap-type="stock" data-source="SENSEX" grouping="no_group" block-size="market_cap_basic" block-color="change" theme="dark"></tv-heatmap>


</body>
</html>
