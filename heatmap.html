<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Heatmap</title>
    <!-- This line silently auto-refreshes the page every 60 seconds for live updates -->
    <meta http-equiv="refresh" content="60">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #131722; 
        }
        .tradingview-widget-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- TradingView Heatmap Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
      {
      "exchanges": [
        "BSE"
      ],
      "dataSource": "AllIN",
      "grouping": "sector",
      "blockSize": "market_cap_basic",
      "blockColor": "change",
      "locale": "in",
      "symbolUrl": "",
      "colorTheme": "dark",
      "hasTopBar": false,
      "isDataSetEnabled": false,
      "isZoomEnabled": false,
      "hasSymbolTooltip": true,
      "isMonoSize": false,
      "width": "100%",
      "height": "100%"
      }
      </script>
    </div>
    <!-- TradingView Heatmap Widget END -->
</body>
</html>
